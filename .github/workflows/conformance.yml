name: conformance

# Every implementation passes the conformance suite for the specification
# version it declares - 137 checks (V01-V137) at 4.0.0 - or it is not
# Causalontology. All nineteen bindings now implement the folded
# 3.0.0-plus-4.0.0 delta and are gated at 137 checks here (registry
# publication is a separate, credential-gated step per the 4.0.0 release plan).
#
# WHAT "137" COUNTS, EXACTLY (say it here too, not only in the documents).
# It is 137 CHECKS, not 137 shared vectors. Only 38 of them are driven by the
# frozen files in conformance/vectors/ that every binding reads; the remaining
# 99 carry no executable payload at all - the "operation" field of V39-V137
# reads literally "see bindings/*/conformance runner" - so they are
# hand-written per binding and share no data with any other implementation.
# A green run here therefore means nineteen runners each passed their own 99
# plus the shared 38. It does not mean one set of 137 vectors was executed
# nineteen times. See conformance/README.md, bindings/README.md and
# PUBLISHING.md, which carry the same disclosure.
#
# TWO MODES, AND WHY (added 2026-07-26). Most binding jobs below run the 137
# checks twice. Which ones do not is spelled out in the coverage table further
# down - a gap that is written down is a gap; a gap left to be inferred from a
# green tick is how this project shipped three broken releases.
#
#   repo mode      - the runner loads the binding from this source tree. This
#                    proves the CODE is conformant.
#   installed mode - the artifact is built, installed into a clean location
#                    outside the checkout, and the same 137 checks are run
#                    from a working directory outside the checkout with
#                    CAUSALONTOLOGY_TEST_INSTALLED=1 and CAUSALONTOLOGY_SPEC
#                    unset. This proves the PACKAGE is conformant.
#
# Only the first of these existed before, and that gap shipped three broken
# releases: every binding but Rust read the twenty-one JSON Schemas from a
# repository-relative path and packaged none of them, while every runner
# reached the binding by relative path from the source tree - so a run
# advertised as a fresh install exercised the repository sitting next to it
# and reported a confident 137/137 for a package that could not validate a
# single record. See PUBLISHING.md.
#
# In installed mode the runner prints the binding path and the schema
# directory it actually read and exits non-zero if either lies inside the
# repository, if CAUSALONTOLOGY_SPEC is set, or if the packaged schemas differ
# from spec/schema by one byte. CAUSALONTOLOGY_ROOT, where it appears, locates
# the 137 vectors only: they are test data and are deliberately not shipped
# inside any package.
#
# INSTALLED-MODE COVERAGE, ALL NINETEEN BINDINGS. Keep this current; it is the
# only place the gaps are stated rather than implied.
#
#   Full 137-check run against the built artifact, from outside the checkout
#   (14): python (wheel), javascript (npm pack), java (jar), csharp (NuGet
#   pack), ruby (gem), dart (pub-shaped export), elixir (Hex tarball), perl
#   (make dist + install), r (R CMD INSTALL), lua (installed rock), kotlin
#   (jar stand-in for the klib), go (module-only export), php (Composer
#   vendor tree with spec/ deleted), zig (the package `zig fetch` delivers).
#
#   Artifact integrity proved, but NOT a 137-check installed run (3):
#     rust    - schema.rs pulls the schemas in with include_str!, so a crate
#               missing them does not compile; the job asserts all 21 appear
#               in `cargo package --list`, which is what crates.io receives.
#     haskell - a full run needs `cabal install`, which needs a Hackage index
#               this job deliberately does not fetch (the setup action's
#               `cabal update` 404s); the job asserts all 21 schemas are in
#               the sdist, where the data-files manifest is the single point
#               of failure. Full run is in the release runbook and in
#               bindings/haskell/README.md.
#     cpp     - the CMake install and a find_package consumer are exercised
#               outside the checkout, which is how the binding is consumed.
#               A 137-check installed run is blocked in bindings/cpp, not
#               here: conformance.cpp includes "src/*.hpp" by relative path
#               and calls schema_set_spec_dir(<repo>/spec/schema) outright.
#
#   No installed-mode coverage at all (2) - OPEN GAPS, not exemptions:
#     julia   - registration in the General registry is blocked on a reviewer
#               objection, so nothing has been published to install. Pkg
#               clones the whole repository, so an export-and-depend proof is
#               constructible and simply has not been written yet.
#     swift   - SwiftPM resolves a git tag into a checkout, so there is no
#               artifact distinct from a tree; the library derives its schema
#               path from #filePath and so points at whichever checkout
#               compiled it. That makes the proof unusual, not impossible: a
#               consumer package depending on an export outside this
#               repository would still be a real test. It has not been
#               written.

on:
  push:
    branches: [main]
  pull_request:

# Read-only, workflow-wide. Nothing here writes to the repository, creates a
# release, publishes a package or comments on a pull request; the only cross-
# repository access is the public checkout of PrologAI in the `prolog` job,
# which contents:read covers. Set explicitly rather than inherited, so a
# permissive repository default (the "read and write" setting) cannot silently
# hand a token with write scope to twenty-three jobs that run pull-request
# code.
permissions:
  contents: read

jobs:
  # The vendored schemas must be byte-identical to spec/schema, in every
  # binding, always. This job needs no toolchain and covers bindings whose own
  # runner has no drift guard (Rust), so nothing can drift unnoticed.
  #
  # WHERE EVERY SCHEMA COPY IS GUARDED, so the accounting is checkable:
  #   14 bindings vendor loose *.schema.json files - checked in the first step
  #      below, against a list that the same step verifies against git.
  #   kotlin embeds them in generated src/SpecSchemas.kt - checked in the
  #      second step below (regenerate, diff).
  #   dart embeds them in generated lib/spec_schema.g.dart - checked the same
  #      way, but in the `dart` job, because it needs the Dart SDK.
  #   cpp, julia and swift vendor nothing and read spec/schema from the tree
  #      their channel delivers whole. Nothing can drift, because there is no
  #      second copy; what has to be guarded instead is that the tree really
  #      arrives, which the third step below does for the archive-based
  #      channels (the C++ tarball, Packagist) and the fourth does for Zig.
  #      Julia and Swift resolve a git CLONE rather than an archive, so
  #      .gitattributes export-ignore cannot reach them and there is nothing
  #      left to filter spec/ out - but note that this is an argument, not a
  #      measurement, and it is the same shape of argument that was wrong
  #      about Zig. The cpp job additionally proves the CMake install carries
  #      its own copy, since that path does not deliver the tree at all.
  #   That is all nineteen. Adding a copy anywhere else fails the git
  #      cross-check rather than going unnoticed.
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: vendored schemas are byte-identical to spec/schema
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys

          root = pathlib.Path(".").resolve()
          spec = root / "spec" / "schema"
          canonical = {p.name: p.read_bytes()
                       for p in sorted(spec.glob("*.schema.json"))}
          if len(canonical) != 21:
              sys.exit(f"spec/schema holds {len(canonical)} schemas, expected 21")

          # Every binding that ships loose schema files, and where it puts
          # them. This list is checked against git below, so it cannot quietly
          # fall behind reality.
          vendored = [
              "bindings/csharp/spec_schema",
              "bindings/elixir/priv/schema",
              "bindings/go/v4/causalontology/spec_schema",
              "bindings/haskell/spec_schema",
              "bindings/java/src/main/resources/schema",
              "bindings/javascript/spec/schema",
              "bindings/lua/causalontology/spec/schema",
              "bindings/perl/share/schema",
              "bindings/php/spec/schema",
              "bindings/python/causalontology/spec/schema",
              "bindings/r/inst/schema",
              "bindings/ruby/lib/causalontology/spec/schema",
              "bindings/rust/spec_schema",
              "bindings/zig/src/spec_schema",
          ]

          bad = []
          for rel in vendored:
              d = root / rel
              if not d.is_dir():
                  bad.append(f"{rel}: directory is missing entirely")
                  continue
              here = {p.name: p.read_bytes() for p in d.glob("*.schema.json")}
              for name, body in canonical.items():
                  if name not in here:
                      bad.append(f"{rel}/{name}: missing")
                  elif here[name] != body:
                      bad.append(f"{rel}/{name}: differs from spec/schema")
              for name in here:
                  if name not in canonical:
                      bad.append(f"{rel}/{name}: no longer in spec/schema")
              print(f"{rel}: {len(here)} schemas")

          # THE LIST ABOVE MUST NOT GO STALE. Ask git what is actually tracked
          # rather than trusting the hand-written list: a binding that starts
          # vendoring schemas without being added here gets a silent, unguarded
          # copy that can drift from spec/schema indefinitely, and one that
          # stops vendoring leaves a dead entry that hides the change. Both
          # failures look exactly like a green tick, which is the failure mode
          # this whole workflow exists to stop.
          actual = sorted({str(pathlib.PurePosixPath(f).parent)
                           for f in subprocess.run(
                               ["git", "ls-files", "bindings"], check=True,
                               capture_output=True, text=True).stdout.split()
                           if f.endswith(".schema.json")})
          for rel in actual:
              if rel not in vendored:
                  bad.append(f"{rel}: vendors schemas but is not in the list "
                             "above - add it, or nothing checks it for drift")
          for rel in vendored:
              if rel not in actual:
                  bad.append(f"{rel}: listed above but tracks no *.schema.json "
                             "- remove the dead entry")

          if bad:
              print("\n".join(bad))
              sys.exit("vendored schema drift - re-copy from spec/schema")
          print(f"{len(vendored)} vendored copies, {len(canonical)} schemas each, all byte-identical")
          print("and the list matches `git ls-files` exactly")
          PY
      - name: the Kotlin generated source still matches spec/schema
        run: |
          set -eu
          cd bindings/kotlin
          cp src/SpecSchemas.kt "$RUNNER_TEMP/SpecSchemas.kt.before"
          python3 tools/gen_spec_schemas.py
          diff -q "$RUNNER_TEMP/SpecSchemas.kt.before" src/SpecSchemas.kt \
            || { echo "bundled schema drift: regenerate with tools/gen_spec_schemas.py" >&2; exit 1; }
      - name: the whole-repository channels still deliver spec/schema
        run: |
          set -eu
          # C++, Julia and Swift vendor nothing: they are correct only because
          # their channel ships the whole repository tree. Fail if anything
          # starts filtering spec/ out of that tree.
          #
          # PHP and Zig used to be on this list and no longer are. Zig was the
          # proof that the reasoning is not safe: zig fetch prunes the tarball
          # to the root build.zig.zon .paths list and ignores .gitattributes
          # and composer.json entirely, so this job could never have caught it -
          # a consumer got ten files and zero schemas. Both now vendor their own
          # copies and are covered by the drift job above instead.
          if [ -f .gitattributes ] && grep -E '^\s*(/)?spec/' .gitattributes | grep -q export-ignore; then
            echo "spec/ is export-ignored: the tag archives would ship no schemas" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          m = json.load(open("composer.json"))
          excluded = m.get("archive", {}).get("exclude", [])
          if any("spec" in str(e) for e in excluded):
              sys.exit("composer.json excludes spec/ from the dist archive")
          print("composer.json ships the whole tree; .gitattributes does not filter spec/")
          PY
      - name: the root build.zig.zon .paths still delivers the Zig channel
        run: |
          set -eu
          # THE ZIG DEFECT, MADE UNREPEATABLE. `zig fetch` prunes the tarball
          # to exactly the root build.zig.zon .paths list before hashing and
          # caching it - it ignores .gitattributes and composer.json, so the
          # step above could never have caught this - and spec/ was not on the
          # list. A consumer received ten files and zero schemas.
          #
          # This reproduces zig's pruning rule statically (a path entry ships
          # itself and, if it is a directory, everything beneath it) over the
          # tracked file list, and fails if the resulting package is missing
          # anything the channel must deliver. Static on purpose: it needs no
          # Zig toolchain, so it runs in this dependency-free job and cannot be
          # skipped. The `zig` job below then fetches a real package and runs
          # the suite inside it, which proves the rule was reproduced correctly.
          python3 - <<'PY'
          import pathlib, re, subprocess, sys

          zon = pathlib.Path("build.zig.zon").read_text()
          m = re.search(r"\.paths\s*=\s*\.\{(.*?)\}\s*,?\s*\}\s*\Z", zon, re.S)
          if not m:
              sys.exit("build.zig.zon: cannot find the .paths list")
          paths = re.findall(r'"([^"]*)"', m.group(1))
          if not paths:
              sys.exit("build.zig.zon: .paths is empty - a consumer gets nothing")
          print("build.zig.zon .paths =", paths)

          tracked = subprocess.run(["git", "ls-files"], check=True,
                                   capture_output=True, text=True).stdout.split()
          delivered = [f for f in tracked
                       if any(f == p or f.startswith(p.rstrip("/") + "/")
                              for p in paths)]

          def n(prefix, suffix=""):
              return sum(1 for f in delivered
                         if f.startswith(prefix) and f.endswith(suffix))

          bad = []
          for what, got, want in (
              ("spec/schema/*.schema.json",
               n("spec/schema/", ".schema.json"), 21),
              ("bindings/zig/src/spec_schema/*.schema.json (compiled in)",
               n("bindings/zig/src/spec_schema/", ".schema.json"), 21),
              ("conformance/vectors/*",
               n("conformance/vectors/"), 137),
          ):
              if got != want:
                  bad.append(f"{what}: zig fetch would deliver {got}, expected {want}")
          for f in ("build.zig", "build.zig.zon", "LICENSE", "NOTICE",
                    "bindings/zig/run_conformance.sh",
                    "bindings/zig/conformance.zig",
                    "bindings/zig/src/causalontology.zig"):
              if f not in delivered:
                  bad.append(f"{f}: pruned away by .paths")

          if bad:
              print("\n".join(bad))
              sys.exit("build.zig.zon .paths prunes files the Zig channel must "
                       "deliver - a `zig fetch` consumer would get a package "
                       "that cannot validate or cannot verify itself")
          print(f"zig fetch would deliver {len(delivered)} tracked files: "
                "21 schemas under spec/schema, 21 compiled into the library, "
                "137 vectors")
          PY

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: conformance (137 checks)
        run: python3 bindings/python/tests/run_conformance.py
      - name: conformance against the installed wheel (137 checks)
        run: |
          set -eux
          python3 -m pip install --quiet build
          # Build WITH the wheel build tag. The plain filename
          # causalontology-4.0.0-py3-none-any.whl is burned on PyPI - that is the
          # defective upload - so the release artifact must be the build-tagged
          # causalontology-4.0.0-1-py3-none-any.whl. Building it here keeps CI
          # honest about the file that actually ships.
          python3 -m build --wheel --config-setting=--build-option=--build-number=1 \
            --outdir "$RUNNER_TEMP/pydist" bindings/python
          test -f "$RUNNER_TEMP/pydist/causalontology-4.0.0-1-py3-none-any.whl"
          python3 -m venv "$RUNNER_TEMP/pyvenv"
          "$RUNNER_TEMP/pyvenv/bin/pip" install --no-index --no-deps "$RUNNER_TEMP"/pydist/*.whl
          mkdir -p "$RUNNER_TEMP/pyconsumer"
          cd "$RUNNER_TEMP/pyconsumer"
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            "$RUNNER_TEMP/pyvenv/bin/python" \
            "$GITHUB_WORKSPACE/bindings/python/tests/run_conformance.py"
      - name: Tier A store smoke
        run: python3 store/server/test_server.py
      - name: stigmergy layer
        run: python3 store/server/test_stigmergy.py
      - name: SPARQL, reputation, Tier B federation
        run: python3 store/server/test_beyond.py
      - name: Tier C replication (the CRDT laws)
        run: python3 store/server/test_tierc.py
      - name: persistent node (Phase one, Part 21)
        run: python3 store/server/test_persistence.py

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: conformance (137 checks)
        run: node bindings/javascript/tests/run_conformance.js
      - name: conformance against the packed npm tarball (137 checks)
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/jspack" "$RUNNER_TEMP/jsconsumer"
          (cd bindings/javascript && npm pack --pack-destination "$RUNNER_TEMP/jspack")
          cd "$RUNNER_TEMP/jsconsumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/jspack/causalontology-*.tgz
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            node "$GITHUB_WORKSPACE/bindings/javascript/tests/run_conformance.js"

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: conformance (137 checks)
        run: bash bindings/java/run_conformance.sh
      - name: conformance against the built jar (137 checks)
        run: |
          set -eux
          sh bindings/java/build_jar.sh
          mkdir -p "$RUNNER_TEMP/javainstall" "$RUNNER_TEMP/javacwd"
          cp bindings/java/target/causalontology-4.0.0.jar "$RUNNER_TEMP/javainstall/"
          # Compile the runner ALONE, against the jar, and put it outside the
          # workspace. Previously it was run from
          # $GITHUB_WORKSPACE/bindings/java/target/test-classes, which let the
          # runner walk up from its own code source and find the checkout - so
          # the step passed without ever exercising the path a real consumer
          # takes. Now nothing on the classpath is inside the repository, and
          # the vectors are located the way every other binding locates them:
          # CAUSALONTOLOGY_ROOT. CAUSALONTOLOGY_SPEC stays unset, so the schemas
          # must come from inside the jar or the run fails.
          mkdir -p "$RUNNER_TEMP/javarunner"
          javac -cp "$RUNNER_TEMP/javainstall/causalontology-4.0.0.jar" \
            -d "$RUNNER_TEMP/javarunner" \
            "$GITHUB_WORKSPACE"/bindings/java/src/org/causalontology/Conformance.java
          cd "$RUNNER_TEMP/javacwd"
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            CAUSALONTOLOGY_ROOT="$GITHUB_WORKSPACE" \
            java -cp "$RUNNER_TEMP/javainstall/causalontology-4.0.0.jar:$RUNNER_TEMP/javarunner" \
            org.causalontology.Conformance

  swift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2  # v3 is broken: its own gpg step exits 2. Dependabot #10 declined.
        with:
          swift-version: "5.10"
      - name: conformance (137 checks)
        run: cd bindings/swift && swift run conformance

  gardener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog
      - name: the synthetic mind gardens the commons
        run: python3 examples/gardener/test_gardener.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: conformance (137 checks)
        run: cd bindings/rust && cargo run --bin conformance
      - name: the packaged crate carries all 21 schemas
        run: |
          set -eu
          # Rust has no installed mode and needs none: schema.rs pulls the
          # twenty-one schemas in with include_str!, so a crate missing them
          # does not compile. This asserts they are in the packaged file list
          # as well, which is what crates.io actually receives.
          cd bindings/rust
          n=$(cargo package --list --allow-dirty | grep -c '^spec_schema/.*\.schema\.json$')
          echo "spec_schema entries in the packaged crate: $n"
          [ "$n" -eq 21 ] || { echo "expected 21, got $n" >&2; exit 1; }
      - name: WebAssembly core build
        run: cd bindings/rust && cargo build --lib --release --target wasm32-unknown-unknown
      - name: WASM vs JavaScript cross-check
        run: node bindings/rust/tests/wasm_check.js

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
      # The 4.0.0 code is the new /v4 module (Go versions the import path); the
      # /v2 module stays live at the 2.0.0 level. Gate on /v4.
      - name: conformance (137 checks)
        run: cd bindings/go/v4 && go run ./conformance
      - name: conformance against the module as it would be published (137 checks)
        run: |
          set -eux
          # A Go module ships only its own subdirectory. Reproduce that exactly:
          # export the tracked contents of bindings/go/v4 - nothing else from
          # the repository - to a directory outside the checkout and build
          # there. If go:embed loses the schemas, this step fails to compile,
          # which is the strongest guard any binding here has.
          mkdir -p "$RUNNER_TEMP/gomod" "$RUNNER_TEMP/gocwd"
          git archive HEAD bindings/go/v4 | tar -x -C "$RUNNER_TEMP/gomod" --strip-components=3
          (cd "$RUNNER_TEMP/gomod" && go build -o "$RUNNER_TEMP/goconformance" ./conformance)
          cd "$RUNNER_TEMP/gocwd"
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            CAUSALONTOLOGY_ROOT="$GITHUB_WORKSPACE" "$RUNNER_TEMP/goconformance"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: type-check the typed JavaScript binding
        run: cd bindings/javascript && npx -y -p typescript@5.5 tsc -p .

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: conformance (137 checks)
        run: dotnet run --project bindings/csharp/conformance
      - name: conformance against the packed NuGet package (137 checks)
        run: |
          set -eux
          # Pack from an export of the TRACKED files only, outside the checkout.
          # Two reasons. First, it proves the package is built from what git
          # actually carries - if a vendored schema were untracked, the pack
          # would come out empty and this step would fail, which is the class of
          # mistake this branch exists to close. Second, redirecting
          # BaseIntermediateOutputPath in place does not work: obj/ is excluded
          # from the compile glob only while it IS the intermediate directory,
          # so redirecting it makes the SDK compile both the old obj/ and the new
          # AssemblyInfo.cs and fail with duplicate assembly attributes (CS0579).
          mkdir -p "$RUNNER_TEMP/cssrc"
          git archive HEAD bindings/csharp | tar -x -C "$RUNNER_TEMP/cssrc" --strip-components=2
          test "$(find "$RUNNER_TEMP/cssrc/spec_schema" -name '*.schema.json' | wc -l)" = 21
          dotnet pack "$RUNNER_TEMP/cssrc/Causalontology/Causalontology.csproj" -c Release \
            -o "$RUNNER_TEMP/nugetfeed"
          cat > "$RUNNER_TEMP/nuget.config" <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$RUNNER_TEMP/nugetfeed" />
            </packageSources>
          </configuration>
          XML
          # conformance.csproj switches from ProjectReference to a
          # PackageReference when this variable is set, so the runner is built
          # against the package, not the source tree.
          # Built from the same clean export, for the same reason: an in-place
          # build would inherit the repo-mode obj/ from the step above.
          NUGET_PACKAGES="$RUNNER_TEMP/nugetcache" CAUSALONTOLOGY_TEST_INSTALLED=1 \
            dotnet build "$RUNNER_TEMP/cssrc/conformance/conformance.csproj" -c Release \
            -o "$RUNNER_TEMP/csinstalled" --configfile "$RUNNER_TEMP/nuget.config"
          mkdir -p "$RUNNER_TEMP/cscwd"
          cd "$RUNNER_TEMP/cscwd"
          # CAUSALONTOLOGY_SPEC stays unset - that is the whole point, the
          # schemas must come from inside the package. CAUSALONTOLOGY_ROOT is
          # set, because it locates the 137 VECTORS, which are test data and are
          # deliberately not shipped in the package. Unsetting both conflates
          # the two and only proves the runner cannot find its own test inputs.
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            CAUSALONTOLOGY_ROOT="$GITHUB_WORKSPACE" \
            dotnet "$RUNNER_TEMP/csinstalled/conformance.dll"

  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: conformance (137 checks)
        run: ruby bindings/ruby/conformance.rb
      - name: conformance against the built gem (137 checks)
        run: |
          set -eux
          # The gemspec itself refuses to build if the vendored schemas are
          # missing, incomplete, or drifted, so this also exercises that guard.
          (cd bindings/ruby && gem build causalontology.gemspec -o "$RUNNER_TEMP/causalontology.gem")
          gem install --install-dir "$RUNNER_TEMP/gemhome" --no-document --local \
            "$RUNNER_TEMP/causalontology.gem"
          mkdir -p "$RUNNER_TEMP/rbcwd"
          cd "$RUNNER_TEMP/rbcwd"
          env -u CAUSALONTOLOGY_SPEC \
            GEM_HOME="$RUNNER_TEMP/gemhome" GEM_PATH="$RUNNER_TEMP/gemhome" \
            CAUSALONTOLOGY_TEST_INSTALLED=1 CAUSALONTOLOGY_ROOT="$GITHUB_WORKSPACE" \
            ruby "$GITHUB_WORKSPACE/bindings/ruby/conformance.rb"

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium
      - name: conformance (137 checks)
        run: php bindings/php/conformance.php
      - name: conformance in a Composer vendor tree with spec/ deleted (137 checks)
        run: |
          set -euxo pipefail
          # What Packagist ships is Composer's dist archive, and that is the
          # WHOLE repository - which, until v4.0.3, was the only reason PHP
          # worked at all. The binding now vendors its own twenty-one schemas
          # under bindings/php/spec/schema, so prove it does not need the
          # accident any more: build a real vendor tree outside the checkout,
          # DELETE the top-level spec/, and run from a working directory
          # outside the repository with CAUSALONTOLOGY_SPEC unset.
          vendor="$RUNNER_TEMP/phpvendor/causalontology/causalontology"
          mkdir -p "$vendor" "$RUNNER_TEMP/phpcwd"
          git archive HEAD | tar -x -C "$vendor"
          rm -rf "$vendor/spec"
          test ! -e "$vendor/spec"
          test "$(find "$vendor/bindings/php/spec/schema" -name '*.schema.json' | wc -l)" = 21
          cd "$RUNNER_TEMP/phpcwd"
          env -u CAUSALONTOLOGY_SPEC php "$vendor/bindings/php/conformance.php" \
            | tee "$RUNNER_TEMP/php-installed.log"
          # conformance.php prints the two files it actually loaded. Assert
          # both live in the vendor tree and neither in the checkout: unlike
          # Python, JavaScript, Go and the rest, this runner carries no
          # repo-path guard of its own, so the guard has to live here.
          grep -q "^binding under test: $vendor/" "$RUNNER_TEMP/php-installed.log"
          grep -q "^schemas under test: $vendor/" "$RUNNER_TEMP/php-installed.log"
          ! grep -E "^(binding|schemas) under test: $GITHUB_WORKSPACE/" \
            "$RUNNER_TEMP/php-installed.log"

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: conformance (137 checks)
        run: |
          set -eu
          # conformance.dart now imports package:causalontology/... rather than
          # reaching sideways with a relative path, so it has to run from inside
          # the package with its package config resolved. Running it from the
          # repository root was what the old relative imports allowed, and is
          # exactly the reaching-out-of-the-package habit this branch removes.
          cd bindings/dart
          dart pub get
          dart run bin/conformance.dart
      - name: the generated embedding still matches spec/schema
        run: |
          set -eu
          cd bindings/dart
          cp lib/spec_schema.g.dart "$RUNNER_TEMP/spec_schema.g.dart.before"
          dart run tool/embed_schemas.dart
          diff -q "$RUNNER_TEMP/spec_schema.g.dart.before" lib/spec_schema.g.dart \
            || { echo "embedded schema drift: rerun tool/embed_schemas.dart" >&2; exit 1; }
      - name: conformance against the package as it would be published (137 checks)
        run: |
          set -eux
          # pub.dev ships the tracked files of bindings/dart and nothing else -
          # no spec/schema anywhere. Export exactly that to a directory outside
          # the checkout and consume it as a real dependency.
          mkdir -p "$RUNNER_TEMP/dartpkg" "$RUNNER_TEMP/dartconsumer"
          git archive HEAD bindings/dart | tar -x -C "$RUNNER_TEMP/dartpkg" --strip-components=2
          cd "$RUNNER_TEMP/dartconsumer"
          cat > pubspec.yaml <<'YAML'
          name: installed_mode_consumer
          publish_to: none
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            causalontology:
              path: ../dartpkg
          YAML
          dart pub get
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            CAUSALONTOLOGY_ROOT="$GITHUB_WORKSPACE" dart run causalontology:conformance

  elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"
      - name: conformance (137 checks)
        run: cd bindings/elixir && elixir conformance.exs
      - name: conformance against the built Hex package (137 checks)
        run: |
          set -eux
          mix local.hex --force
          # Build the Hex tarball from a copy outside the checkout, unpack its
          # payload exactly as Hex leaves it in deps/, and compile it as a real
          # dependency of a throwaway consumer project.
          cp -a bindings/elixir "$RUNNER_TEMP/exsrc"
          (cd "$RUNNER_TEMP/exsrc" && mix hex.build)
          mkdir -p "$RUNNER_TEMP/exconsumer/deps/causalontology" "$RUNNER_TEMP/exunpack"
          tar -xf "$RUNNER_TEMP"/exsrc/causalontology-*.tar -C "$RUNNER_TEMP/exunpack"
          tar -xzf "$RUNNER_TEMP/exunpack/contents.tar.gz" \
            -C "$RUNNER_TEMP/exconsumer/deps/causalontology"
          cd "$RUNNER_TEMP/exconsumer"
          cat > mix.exs <<'EX'
          defmodule Consumer.MixProject do
            use Mix.Project
            def project do
              [app: :consumer, version: "0.0.0", elixir: "~> 1.16",
               deps: [{:causalontology, path: "deps/causalontology"}]]
            end
          end
          EX
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            CAUSALONTOLOGY_ROOT="$GITHUB_WORKSPACE" \
            mix run deps/causalontology/conformance.exs

  haskell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The binding uses only GHC boot packages (base, bytestring, containers,
      # filepath, directory), so it needs no Hackage index at all. Skip the
      # setup action's internal `cabal update` (it fetches a Hackage mirror that
      # has 404'd, failing the job in setup before conformance can run) and run
      # the vectors directly with runghc - no cabal, no network, boot packages
      # only. Verified locally: 137/137.
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-update: false
      - name: conformance (137 checks)
        run: cd bindings/haskell && runghc -isrc -iapp app/Conformance.hs
      - name: the built sdist carries all 21 schemas
        run: |
          set -eux
          # Haskell ships its schemas as Cabal data-files, so the manifest is
          # the single point of failure and this is where it is checked. A full
          # installed-mode run needs `cabal install`, which needs a Hackage
          # index this job deliberately does not fetch (see the note above); it
          # is part of the release runbook instead, and is recorded in
          # bindings/haskell/README.md.
          cd bindings/haskell
          cabal sdist -o "$RUNNER_TEMP/hssdist"
          n=$(tar -tzf "$RUNNER_TEMP"/hssdist/causalontology-*.tar.gz \
                | grep -c '/spec_schema/.*\.schema\.json$')
          echo "spec_schema entries in the sdist: $n"
          [ "$n" -eq 21 ] || { echo "expected 21, got $n" >&2; exit 1; }

  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: conformance (137 checks)
        run: perl bindings/perl/conformance.pl
      - name: conformance against the installed distribution (137 checks)
        run: |
          set -eux
          # make dist ships only what MANIFEST names, so this exercises the
          # MANIFEST guard as well as the install.
          cp -a bindings/perl "$RUNNER_TEMP/perlsrc"
          cd "$RUNNER_TEMP/perlsrc"
          perl Makefile.PL >/dev/null
          make dist >/dev/null
          tar -xzf Causalontology-*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/Causalontology-*/
          perl Makefile.PL INSTALL_BASE="$RUNNER_TEMP/perlinstall" >/dev/null
          make >/dev/null
          make install >/dev/null
          mkdir -p "$RUNNER_TEMP/perlcwd"
          cd "$RUNNER_TEMP/perlcwd"
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            PERL5LIB="$RUNNER_TEMP/perlinstall/lib/perl5" \
            perl "$GITHUB_WORKSPACE/bindings/perl/conformance.pl"

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - name: crypto libraries + R packages
        run: |
          sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev
          Rscript -e "install.packages(c('sodium','openssl'), repos='https://cloud.r-project.org')"
      - name: conformance (137 checks)
        run: Rscript bindings/r/conformance.R
      - name: conformance against the installed package (137 checks)
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/rbuild" "$RUNNER_TEMP/rlib" "$RUNNER_TEMP/rcwd"
          (cd "$RUNNER_TEMP/rbuild" && R CMD build "$GITHUB_WORKSPACE/bindings/r")
          R CMD INSTALL --library="$RUNNER_TEMP/rlib" "$RUNNER_TEMP"/rbuild/causalontology_*.tar.gz
          cd "$RUNNER_TEMP/rcwd"
          env -u CAUSALONTOLOGY_SPEC -u CAUSALONTOLOGY_ROOT CAUSALONTOLOGY_TEST_INSTALLED=1 \
            R_LIBS="$RUNNER_TEMP/rlib" \
            Rscript "$GITHUB_WORKSPACE/bindings/r/conformance.R"

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: conformance (137 checks)
        run: lua5.4 bindings/lua/conformance.lua
      - name: install LuaRocks
        # liblua5.4-dev too: luarocks refuses to build any rock without the Lua
        # headers ("Failed finding Lua header files"), even for a pure-Lua rock
        # that compiles nothing.
        run: sudo apt-get install -y luarocks liblua5.4-dev
      - name: conformance against the installed rock (137 checks)
        run: |
          set -eux
          # luarocks make must run with the rockspec's own directory as the
          # working directory; anything else fails loudly rather than quietly.
          (cd bindings/lua && luarocks --lua-version 5.4 \
            --tree="$RUNNER_TEMP/luathrowaway" make \
            --pack-binary-rock causalontology-4.0.0-1.rockspec)
          luarocks --lua-version 5.4 --tree="$RUNNER_TEMP/luatree" install \
            bindings/lua/causalontology-4.0.0-1.all.rock
          rm -f bindings/lua/causalontology-4.0.0-1.all.rock
          mkdir -p "$RUNNER_TEMP/luacwd"
          cd "$RUNNER_TEMP/luacwd"
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            LUA_PATH="$RUNNER_TEMP/luatree/share/lua/5.4/?.lua;$RUNNER_TEMP/luatree/share/lua/5.4/?/init.lua" \
            lua5.4 "$GITHUB_WORKSPACE/bindings/lua/conformance.lua"

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: conformance (137 checks)
        run: bash bindings/cpp/run_conformance.sh
      - name: the CMake install stands on its own outside the checkout
        run: |
          set -euxo pipefail
          # NOT a 137-check run, and the step name does not pretend otherwise.
          # A full installed-mode conformance run is impossible from here
          # without a bindings/cpp change: conformance.cpp includes
          # "src/*.hpp" by relative path (the install lays the headers out
          # flat) and calls schema_set_spec_dir(<repo>/spec/schema) outright,
          # so it can neither compile against the installed package nor be
          # made to read the installed schemas. This is the honest upper bound
          # until that is fixed.
          #
          # What it does cover is the thing the repo-mode run structurally
          # cannot. run_conformance.sh compiles the sources in place and hands
          # the library the repository's own spec/schema. How anyone actually
          # consumes this binding is `cmake --install` plus find_package - and
          # at v4.0.1 that install shipped fifteen files and ZERO schemas, so
          # a consumer could not validate a single record. Every job here was
          # green throughout.
          cmake -S bindings/cpp -B "$RUNNER_TEMP/cppbuild" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/cppprefix"
          cmake --build "$RUNNER_TEMP/cppbuild" -j
          cmake --install "$RUNNER_TEMP/cppbuild"
          echo "installed files: $(find "$RUNNER_TEMP/cppprefix" -type f | wc -l)"
          test "$(find "$RUNNER_TEMP/cppprefix/share/causalontology/spec/schema" \
                    -name '*.schema.json' | wc -l)" = 21
          mkdir -p "$RUNNER_TEMP/cppconsumer" "$RUNNER_TEMP/cppcwd"
          cd "$RUNNER_TEMP/cppconsumer"
          cat > CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.16)
          project(installed_mode_consumer LANGUAGES CXX)
          find_package(causalontology CONFIG REQUIRED)
          add_executable(consumer consumer.cpp)
          target_link_libraries(consumer PRIVATE causalontology::causalontology)
          CM
          # No schema_set_spec_dir() call and no CAUSALONTOLOGY_SPEC below, so
          # the twenty-one schemas must come from the install prefix that
          # CMakeLists.txt compiled in, or validate_schema throws.
          cat > consumer.cpp <<'CPP'
          #include <json.hpp>
          #include <schema.hpp>
          #include <fstream>
          #include <iostream>
          #include <sstream>
          int main(int argc, char** argv) {
              if (argc < 2) return 2;
              std::ifstream f(argv[1]);
              std::stringstream ss; ss << f.rdbuf();
              co::JValue vec = co::json_parse(ss.str());
              auto r = co::validate_schema(vec.at("input"));
              std::cout << "valid=" << (r.first ? "true" : "false") << "\n";
              return r.first ? 0 : 1;
          }
          CPP
          # Copy the vector out first: the run must touch no repository path.
          cp "$GITHUB_WORKSPACE/conformance/vectors/v01_complete_cro_is_valid.json" vec.json
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/cppprefix"
          cmake --build build
          cd "$RUNNER_TEMP/cppcwd"
          env -u CAUSALONTOLOGY_SPEC "$RUNNER_TEMP/cppconsumer/build/consumer" \
            "$RUNNER_TEMP/cppconsumer/vec.json"

  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install the pinned Zig 0.13.0
        run: |
          set -eux
          # run_conformance.sh downloads this same pinned release when no zig
          # is on PATH, so the repo-mode step works either way. It is installed
          # explicitly here because the installed-mode step below needs to call
          # `zig fetch` itself, and both steps must use one toolchain.
          curl -sSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: conformance (137 checks)
        run: bash bindings/zig/run_conformance.sh
      - name: conformance inside the package zig fetch really delivers (137 checks)
        run: |
          set -eux
          # THE ONE DEFECT NOBODY PREDICTED, NOW GATED. `zig fetch` prunes the
          # tarball to the root build.zig.zon .paths list before caching it, so
          # what a Zig consumer receives is not the tree in front of you. At
          # v4.0.1 that pruning left ten files and zero schemas and every job
          # in this workflow stayed green.
          #
          # So: fetch a package built from the tracked tree exactly as a
          # consumer does, then run the suite INSIDE the pruned copy from a
          # working directory outside the checkout with CAUSALONTOLOGY_SPEC
          # unset. A pass proves the bytes a consumer receives, not the
          # repository sitting next to them. The `schemas` job checks the same
          # property statically and without a toolchain; this is the one that
          # actually executes the delivered package.
          mkdir -p "$RUNNER_TEMP/zigsrc" "$RUNNER_TEMP/zigcwd"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/zigsrc"
          zig fetch --global-cache-dir "$RUNNER_TEMP/zigcache" "$RUNNER_TEMP/zigsrc"
          pkg=$(find "$RUNNER_TEMP/zigcache/p" -mindepth 1 -maxdepth 1 -type d)
          echo "fetched package: $pkg"
          echo "files delivered: $(find "$pkg" -type f | wc -l)"
          test "$(find "$pkg/spec/schema" -name '*.schema.json' | wc -l)" = 21
          test "$(find "$pkg/bindings/zig/src/spec_schema" -name '*.schema.json' | wc -l)" = 21
          test "$(find "$pkg/conformance/vectors" -type f | wc -l)" = 137
          cd "$RUNNER_TEMP/zigcwd"
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            bash "$pkg/bindings/zig/run_conformance.sh"

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10"
      - name: conformance (137 checks)
        run: julia bindings/julia/conformance.jl

  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: conformance (137 checks)
        run: bash bindings/kotlin/run_conformance.sh
      - name: conformance against the built artifact (137 checks)
        run: |
          set -eux
          # The registry artifact for Kotlin is the Kotlin/Native klib, which
          # the Java Virtual Machine runner cannot execute; tools/build_jar.sh
          # builds the same library sources - including the generated
          # src/SpecSchemas.kt that carries the twenty-one schemas - with
          # kotlinc-jvm, outside the repository, as a faithful stand-in. The
          # schemas job above independently checks that generated source
          # against spec/schema.
          bash bindings/kotlin/tools/build_jar.sh "$RUNNER_TEMP/kotlinm2"
          mkdir -p "$RUNNER_TEMP/ktcwd"
          cd "$RUNNER_TEMP/ktcwd"
          env -u CAUSALONTOLOGY_SPEC CAUSALONTOLOGY_TEST_INSTALLED=1 \
            CAUSALONTOLOGY_KOTLIN_JAR="$RUNNER_TEMP/kotlinm2/causalontology-kotlin-4.0.0.jar" \
            bash "$GITHUB_WORKSPACE/bindings/kotlin/run_conformance.sh"

  # The reference implementation gates itself. Prolog is listed first among the
  # bindings and PrologAI is named the reference implementation, so its
  # conformance must be gated here, not merely asserted in prose. PrologAI is
  # checked out beside the standard and run through its own canonical
  # conformance harness (built in PrologAI Work Package 425 / WP-425) against
  # THIS repository's canonical conformance/vectors/ (137 vector files frozen
  # at 4.0.0, of which 38 carry an executable payload and 99 are placeholders
  # naming the per-binding runner - see the header of this file). Both
  # repositories thus stay in lockstep on one vector set: the reference
  # implementation cannot silently drift from the specification. This job is
  # distinct from the `gardener` job, which also installs SWI-Prolog but runs
  # the Mentova gardener demo rather than the 137 conformance vectors.
  prolog:
    runs-on: ubuntu-latest
    steps:
      # The standard: this repository's canonical conformance/vectors/ frozen at
      # specification 4.0.0 - 137 vector files, 38 of them executable. What
      # this job can therefore detect is drift in those 38; the other 99 are
      # PrologAI's own, exactly as they are every other binding's own.
      - name: check out the standard (causalontology)
        uses: actions/checkout@v7
        with:
          path: causalontology
      # The reference implementation, tracked at its MOVING main branch, not a
      # fixed commit. This is deliberate: the job's purpose is DRIFT DETECTION,
      # and a fixed pin cannot detect drift -- it can only freeze the gate at one
      # historical revision, which is precisely how the old 7b3aa86 pin fell
      # behind Wave 1 and stopped testing what ships. The accepted trade-off:
      # this job is intentionally NOT reproducible across time. The same
      # causalontology commit may go green today and red tomorrow if PrologAI's
      # main regresses or the standard re-baselines ahead of it -- that is the gate
      # working, not a flake. This is safe
      # because PrologAI self-gates the same canonical vectors it vendors on its own push, so
      # its main is either conformant or already red at the source.
      #
      # Considered alternative (recorded so the choice is remembered as a
      # choice): if reproducibility ever matters more than freshness, replace
      # `main` with a moving tag (e.g. causalontology-gate) that PrologAI
      # advances only after it verifies the full canonical count, and pin this job to that tag.
      # That trades drift-detection latency for reproducibility. Not adopted:
      # freshness is the point of this gate.
      - name: check out the reference implementation (PrologAI)
        uses: actions/checkout@v7
        with:
          repository: ai-university-aiu/PrologAI
          ref: main
          path: prologai
      - name: install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog
      # Overlay the standard's canonical vectors onto the harness's vendored
      # copy, then run PrologAI's harness. Overlaying the canonical set means any
      # drift between the two repositories fails this job; a clean run gates the
      # reference implementation on the exact canonical vectors the other bindings
      # are gated on. When the standard re-baselines ahead of PrologAI (as at a
      # major version), this job goes red until PrologAI catches up - that is
      # the gate working, not a flake.
      - name: conformance (canonical vectors, reference implementation vs canonical)
        run: |
          cp -a causalontology/conformance/vectors/. prologai/tests/causalontology_conformance/vectors/
          cd prologai && ./bin/run_causalontology_conformance.sh
