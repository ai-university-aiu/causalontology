[package]
name = "causalontology"
# 4.0.1: the library was always sound (the twenty-one schemas are compiled in
# with include_str!), but the `conformance` binary in 4.0.0 hardcoded the
# vector directory to a repository-relative path with no override, so an
# installed copy panicked on first run. A crates.io version is immutable, so
# the corrected binary and README can only reach consumers as a new version.
version = "4.0.1"
edition = "2021"
description = "The Rust binding of the Causalontology standard - a verb-first noun-hosting ontology; reified causation as a programming-language-neutral standard and shared commons."
license-file = "LICENSE"
repository = "https://github.com/ai-university-aiu/causalontology"
readme = "README.md"

[lib]
# cdylib alongside rlib so the same audited core compiles to WebAssembly
crate-type = ["rlib", "cdylib"]

[dependencies]
# vetted primitives (the standard's rule is "passes all 137 checks", not "no deps";
# hand-rolled curve math in a systems language is a vulnerability, not a virtue)
sha2 = "0.11"
ed25519-dalek = "3"
serde_json = "1"
regex = "1"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
